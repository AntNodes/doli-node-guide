# DOLI mainnet producer node. Параметры — в .env (образец: .env.example).
# P2P 30300/tcp и discv5 30301/udp открыты наружу — так у ноды больше пиров (необязательно).
# RPC 8500 опубликован только на 127.0.0.1 сервера.
services:
  doli:
    build:
      context: .
      args:
        DOLI_VERSION: ${DOLI_VERSION}
        DOLI_COMMIT: ${DOLI_COMMIT}
    image: local/doli:${DOLI_VERSION}
    container_name: doli-node
    restart: unless-stopped
    user: "1000:1000"
    command: >
      doli-node --network mainnet --data-dir /node/data --log-level info run
      --no-auto-update
      --p2p-port 30300 --discv5-port 30301
      --rpc-port 8500 --rpc-bind 0.0.0.0 --metrics-port 9000
      --bootstrap /dns4/seed1.doli.network/tcp/30300
      --bootstrap /dns4/seed2.doli.network/tcp/30300
      --bootstrap /dns4/seed3.doli.network/tcp/30300
      ${PRODUCER_ARGS}
    ports:
      - "30300:30300/tcp"
      - "30301:30301/udp"
      - "127.0.0.1:8500:8500"
    volumes:
      - ${NODE_DIR}:/node          # node_key ляжет сюда, данные — в /node/data
      - ${KEYS_DIR}:/keys:ro
    mem_limit: 4g
    memswap_limit: 4g
    cpus: ${DOLI_CPUS:-4}         # не больше числа ядер сервера, иначе контейнер не стартует
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -X POST http://127.0.0.1:8500 -H 'Content-Type: application/json' -d '{\"jsonrpc\":\"2.0\",\"method\":\"getChainInfo\",\"params\":{},\"id\":1}' | grep -q result"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  # Кошелёк и producer: docker compose run --rm cli -w /keys/producer.json info
  cli:
    image: local/doli:${DOLI_VERSION}
    profiles: [cli]
    user: "1000:1000"
    entrypoint: ["doli", "--rpc", "http://doli:8500", "--network", "mainnet"]
    volumes:
      - ${KEYS_DIR}:/keys
